name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Format
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { throw "Unformatted files: $files" }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -buildvcs=false -o dist/ ./cmd/codexr
